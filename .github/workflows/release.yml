name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (defaults to tag without leading v)'
        required: false
        type: string

jobs:
  msi:
    name: build MSI installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -ne '') {
            $v = '${{ inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $v = '0.0.0-dev'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore + test
        run: |
          dotnet restore OpenReader.slnx
          dotnet build OpenReader.slnx -c Release --no-restore
          dotnet test  OpenReader.slnx -c Release --no-build

      - name: Publish host
        run: >
          dotnet publish src/ReaderHost.Windows -c Release -r win-x64
          --self-contained false -o publish/host

      - name: Install WiX tool
        run: dotnet tool install --global wix --version 4.0.5

      - name: Regenerate installer file list
        shell: pwsh
        run: pwsh scripts/regenerate-installer-files.ps1

      - name: Build MSI
        run: >
          dotnet build installer/OpenReader.Installer.wixproj
          -c Release -p:ProductVersion=${{ steps.ver.outputs.version }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReader-${{ steps.ver.outputs.version }}-msi
          path: installer/bin/**/Release/*.msi
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/bin/**/Release/*.msi
          fail_on_unmatched_files: true

  sdk:
    name: pack + publish OpenReader.Sdk
    runs-on: windows-latest
    timeout-minutes: 15
    needs: msi
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}' -ne '') {
            $v = '${{ github.event.inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $v = '0.0.0-dev'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pack
        run: >
          dotnet pack src/Reader.Abstractions/Reader.Abstractions.csproj
          -c Release -p:Version=${{ steps.ver.outputs.version }}
          -o ./packs

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReader.Sdk-${{ steps.ver.outputs.version }}
          path: ./packs/*.*nupkg

      - name: Push to NuGet.org
        if: github.ref_type == 'tag'
        run: >
          dotnet nuget push ./packs/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
